<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TechCMC - Portail Clients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Liste des Clients (TechCMC)</h1>
        <table id="clientTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <!-- عرض بيانات العملاء -->
            </tbody>
        </table>
        
        <h2>Ajouter un Client</h2>
        <form id="clientForm" action="add_client.php" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">Enregistrer</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
